const PCT_BY_REPS = { 1: 100, 2: 95, 3: 93, 4: 90, 5: 87, 6: 85, 7: 83, 8: 80, 9: 77, 10: 75, 11: 73, 12: 70, 13: 68, 14: 67, 15: 65 };

function estimateOneRM(weight, reps) {
  if (reps <= 1) return weight;
  return weight * (1 + reps / 30);

const PLATE_SIZES_KG = [25, 20, 15, 10, 5, 2.5, 1.25];
const PLATE_SIZES_LB = [45, 35, 25, 10, 5, 2.5];
function calculatePlates(targetWeight, barWeight, unit) {
  const perSide = (targetWeight - barWeight) / 2;
  if (perSide <= 0) return { perSide: 0, plates: [] };
  const sizes = unit === "kg" ? PLATE_SIZES_KG : PLATE_SIZES_LB;
  let remaining = perSide;
  const plates = [];
  for (const size of sizes) {
    while (remaining >= size - 0.001) {
      plates.push(size);
      remaining -= size;
    }
  }
  return { perSide, plates, remainder: remaining };
}
function toKg(v) {
  return v * 0.453592;
}
function toLbs(v) {
  return v * 2.20462;
}
function convertWeight(value, fromUnit, toUnit) {
  if (fromUnit === toUnit) return value;
  return fromUnit === "lbs" ? toKg(value) : toLbs(value);
}
function haversineKm(a, b) {
  const R = 6371;
  const dLat = ((b.lat - a.lat) * Math.PI) / 180;
  const dLng = ((b.lng - a.lng) * Math.PI) / 180;
  const lat1 = (a.lat * Math.PI) / 180;
  const lat2 = (b.lat * Math.PI) / 180;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return R * (2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x)));
}
function totalDistanceKm(points) {
  let d = 0;
  for (let i = 1; i < points.length; i++) d += haversineKm(points[i - 1], points[i]);
  return d;
}
const CALORIE_FACTOR = { run: 1.0, bike: 0.35 };
function estimateRunCalories(distanceKm, weightKg, activity) {

}
function estimateSteps(distanceKm) {

}

function getWorkoutDateSet(workoutLog, runLog) {
  const dates = new Set();
  (workoutLog || []).forEach((l) => dates.add(new Date(l.id).toDateString()));

const RECOVERY_MUSCLES = ["chest", "back", "legs", "shoulders", "biceps", "triceps", "core"];
const RECOVERY_HOURS = 48;
function computeMuscleRecovery(workoutLog) {
  const now = Date.now();
  const lastTrained = {};
  (workoutLog || []).forEach((entry) => {
    entry.exercises.forEach((ex) => {
      const muscle = inferMuscleGroup(ex.name);
      if (!muscle) return;
      if (!lastTrained[muscle] || entry.id > lastTrained[muscle]) lastTrained[muscle] = entry.id;
    });
  });
  return RECOVERY_MUSCLES.map((muscle) => {
    const last = lastTrained[muscle];
    if (!last) return { muscle, pct: 100, hoursSince: null };
    const hoursSince = (now - last) / (1000 * 60 * 60);
    const pct = Math.min(100, Math.round((hoursSince / RECOVERY_HOURS) * 100));
    return { muscle, pct, hoursSince };
  });
}
function startOfWeek(d) {
  const day = new Date(d);
  day.setHours(0, 0, 0, 0);
  day.setDate(day.getDate() - day.getDay());
  return day;
}
function countWorkoutsInWeek(dateSet, weekStart) {
  let count = 0;
  for (let i = 0; i < 7; i++) {
    const day = new Date(weekStart);
    day.setDate(weekStart.getDate() + i);
    if (dateSet.has(day.toDateString())) count++;
  }
  return count;
}
function computeWeekStreak(dateSet) {
  let streak = 0;
  const thisWeekStart = startOfWeek(new Date());
  for (let w = 0; w < 52; w++) {
    const weekStart = new Date(thisWeekStart);
    weekStart.setDate(thisWeekStart.getDate() - w * 7);
    if (countWorkoutsInWeek(dateSet, weekStart) > 0) streak++;
    else break;
  }
  return streak;
}
function getMonthCells(year, month) {
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  return cells;
}

    "END:VEVENT",

function loadTesseract() {
  return new Promise((resolve, reject) => {
    if (window.Tesseract) return resolve(window.Tesseract);
    const existing = document.getElementById("tesseract-script");
    if (existing) {
      existing.addEventListener("load", () => resolve(window.Tesseract));
      existing.addEventListener("error", reject);
      return;
    }
    const script = document.createElement("script");
    script.id = "tesseract-script";
    script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    script.onload = () => resolve(window.Tesseract);
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

function parseNutritionLabel(text) {
  const clean = text.replace(/,/g, "");
  const find = (patterns) => {
    for (const p of patterns) {
      const m = clean.match(p);
      if (m) return m[1];
    }
    return "";
  };
  return {
    cal: find([/calories[^\d]{0,10}(\d{1,4})/i]),
    p: find([/protein[^\d]{0,10}(\d{1,3}(?:\.\d+)?)\s*g/i]),
    c: find([/total\s*carb\w*[^\d]{0,10}(\d{1,3}(?:\.\d+)?)\s*g/i, /carb\w*[^\d]{0,10}(\d{1,3}(?:\.\d+)?)\s*g/i]),
    f: find([/total\s*fat[^\d]{0,10}(\d{1,3}(?:\.\d+)?)\s*g/i, /\bfat[^\d]{0,10}(\d{1,3}(?:\.\d+)?)\s*g/i]),

}

function buildProgram(level, goal, environment, injuryAreas, focusAreas, cardioMode, duration, equipment) {
  const bank = EXERCISES[environment];
  const days = level === "beginner" ? 3 : level === "intermediate" ? 4 : 5;
  const repRange = goal === "strength" ? "4-6" : goal === "fatloss" ? "12-15" : "8-12";
  const sets = goal === "strength" ? 3 : level === "advanced" ? 4 : 3;
  const warmup = WARMUP[environment];
  const cardio = cardioMode && cardioMode !== "none" ? { label: CARDIO_OPTIONS[cardioMode].label, detail: CARDIO_OPTIONS[cardioMode][environment] } : null;
  const durationAdj = duration === 40 ? -1 : duration === 80 ? 1 : 0;
  const splitPlan =
    days === 3
      ? [["push", "legs"], ["pull", "legs"], ["push", "pull"]]
      : days === 4
      ? [["push"], ["pull"], ["legs"], ["push", "pull"]]
      : [["push"], ["pull"], ["legs"], ["push"], ["pull", "legs"]];

  const filterByEquipment = (list) => {
    if (!equipment || environment === "home") return list;
    const filtered = list.filter((e) => {
      const eq = inferEquipment(e.name);
      return eq === null || equipment.includes(eq);
    });
    return filtered.length ? filtered : list;
  };

  const program = splitPlan.map((groups, i) => {
    let exList = [];
    groups.forEach((g) => {
      const base = g === "legs" ? 4 : 3;
      const count = Math.max(2, base + durationAdj);
      const picks = filterByEquipment(bank[g]).slice(0, count);
      exList = exList.concat(picks.map((e) => ({ ...e, group: g })));
    });
    const adjusted = exList.map((ex) => {
      const hit = (injuryAreas || []).find((a) => ex.risky.includes(a));
      if (hit) {
        return { ...ex, flagged: true, note: `Modified for ${hit}: control range of motion, stop short of pain.` };
      }
      return ex;
    });

    (focusAreas || []).forEach((f) => {
      const targetGroup = FOCUS_TO_GROUP[f];
      const applies = targetGroup === null || groups.includes(targetGroup);
      if (!applies) return;
      const extraBank = EXTRA_FOCUS_EXERCISES[environment][f] || [];
      const pick = extraBank.find((name) => !adjusted.some((ex) => ex.name === name));
      if (pick) {
        adjusted.push({ name: pick, risky: [], group: FOCUS_TO_GROUP[f] || groups[0], extra: true, note: `Added for your ${f} focus` });
      }
    });

    return { day: i + 1, groups, exercises: adjusted };
  });
  return { program, sets, repRange, warmup, cardio };
}

function defaultWeekdaySpread(numDays) {
  const slots = new Array(7).fill(null);
  if (numDays <= 0) return slots;
  const gap = 7 / numDays;
  for (let i = 0; i < numDays; i++) {
    const idx = Math.min(Math.round(i * gap), 6);
    slots[idx] = i;
  }
  return slots;
}

function computeWeekMeta(weekIndex, totalWeeks, baseSets) {
  const isDeload = totalWeeks >= 4 && weekIndex === totalWeeks - 1;
  if (isDeload) {
    return {
      sets: Math.max(2, baseSets - 1),
      intensityMultiplier: 0.65,
      label: `Week ${weekIndex + 1} \u00b7 Deload`,
      note: "Lighter load this week to aid recovery before your next block.",
      isDeload: true,
    };
  }
  const bump = Math.floor(weekIndex / 2);
  return {
    sets: baseSets + Math.min(bump, 1),
    intensityMultiplier: Math.round((1 + weekIndex * 0.025) * 100) / 100,
    label: weekIndex === 0 ? "Week 1 \u00b7 Foundation" : `Week ${weekIndex + 1} \u00b7 Progressive overload`,
    note: weekIndex === 0 ? "Focus on form and finding your working weights." : `Suggested weights are ~${Math.round(weekIndex * 2.5)}% higher than Week 1.`,
    isDeload: false,
  };
}

function buildMultiWeekProgram(level, goal, environment, injuryAreas, focusAreas, cardioMode, weekCount, duration, equipment) {
  const base = buildProgram(level, goal, environment, injuryAreas, focusAreas, cardioMode, duration, equipment);
  const weeks = [];
  for (let w = 0; w < weekCount; w++) {
    const meta = computeWeekMeta(w, weekCount, base.sets);
    weeks.push({
      ...base,
      sets: meta.sets,
      intensityMultiplier: meta.intensityMultiplier,
      weekLabel: meta.label,
      weekNote: meta.note,
      isDeload: meta.isDeload,
      weekNumber: w + 1,
    });
  }
  return weeks;
}

function inferEquipment(name) {
  const n = (name || "").toLowerCase();
  if (n.includes("landmine")) return "Landmine";
  if (n.includes("kettlebell")) return "Kettlebell";
  if (n.includes("trap bar")) return "Trap Bar";
  if (n.includes("ez")) return "EZ Bar";
  if (n.includes("cable") || n.includes("pulldown") || n.includes("pushdown") || n.includes("row") && n.includes("seated")) return "Cable Machine";
  if (n.includes("band")) return "Resistance Band";
  if (n.includes("barbell")) return "Barbell";
  if (n.includes("dumbbell")) return "Dumbbell";
  if (n.includes("plate")) return "Plate";
  return null; // bodyweight / no equipment needed
}

const MUSCLE_KEYWORDS = {
  chest: ["bench press", "chest", "push-up", "pushup", "push up", "fly", "dip"],
  back: ["row", "pulldown", "pull-up", "pull up", "pull-apart"],
  biceps: ["curl"],
  triceps: ["tricep", "pushdown", "extension", "diamond push"],
  shoulders: ["shoulder", "overhead press", "lateral raise", "delt", "pike"],
  legs: ["squat", "lunge", "deadlift", "leg press", "leg curl", "leg extension", "calf", "glute", "step-up", "wall sit"],
  core: ["plank", "crunch", "woodchop", "leg raise", "ab "],
};
function inferMuscleGroup(name) {
  const n = (name || "").toLowerCase();
  for (const [group, keys] of Object.entries(MUSCLE_KEYWORDS)) {
    if (keys.some((k) => n.includes(k))) return group;
  }
  return null;
}

function movementPattern(name) {
  const n = (name || "").toLowerCase();
  const table = [
    ["squat", ["squat", "wall sit", "step-up", "step up", "lunge"]],
    ["hinge", ["deadlift", "glute bridge", "hip thrust", "superman", "good morning"]],
    ["row", ["row", "pulldown", "pull-apart", "face pull", "pull-up"]],
    ["curl", ["curl"]],
    ["core", ["plank", "woodchop", "leg raise", "crunch"]],
    ["calf", ["calf"]],
  ];
  for (const [pattern, keys] of table) {
    if (keys.some((k) => n.includes(k))) return pattern;
  }
  return "press";
}

function LeafletMap({ points }) {
  const containerRef = useRef(null);
  const mapRef = useRef(null);
  const lineRef = useRef(null);

  useEffect(() => {
    if (!window.L || !containerRef.current || mapRef.current) return;
    const map = window.L.map(containerRef.current, { zoomControl: true, attributionControl: true }).setView([0, 0], 16);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
    lineRef.current = window.L.polyline([], { color: "#f97316", weight: 4 }).addTo(map);
    mapRef.current = map;
  }, []);

  useEffect(() => {
    if (!mapRef.current || !window.L) return;
    if (!points || points.length === 0) return;
    const latlngs = points.map((p) => [p.lat, p.lng]);
    lineRef.current.setLatLngs(latlngs);
    if (latlngs.length === 1) {
      mapRef.current.setView(latlngs[0], 16);
    } else {
      mapRef.current.fitBounds(window.L.latLngBounds(latlngs), { padding: [24, 24] });
    }
  }, [points]);

  return (
    <div className="w-full bg-zinc-900 rounded-lg overflow-hidden">
      {(!points || points.length === 0) && (
        <div className="w-full h-48 flex items-center justify-center text-xs text-zinc-500">
          Map appears once GPS starts tracking your route
        </div>
      )}
      <div ref={containerRef} style={{ width: "100%", height: points && points.length ? "220px" : "0px" }} />
    </div>
  );
}

function RoutePlot({ points }) {
  if (!points || points.length < 2) {
    return (
      <div className="w-full h-48 bg-zinc-900 rounded-lg flex items-center justify-center text-xs text-zinc-500">
        Map appears once GPS starts tracking your route
      </div>
    );
  }
  const lats = points.map((p) => p.lat);
  const lngs = points.map((p) => p.lng);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const w = 300, h = 180, pad = 16;
  const spanLat = maxLat - minLat || 0.0005;
  const spanLng = maxLng - minLng || 0.0005;
  const coords = points.map((p) => {
    const x = pad + ((p.lng - minLng) / spanLng) * (w - pad * 2);
    const y = h - pad - ((p.lat - minLat) / spanLat) * (h - pad * 2);
    return `${x},${y}`;
  });
  return (
    <div className="w-full bg-zinc-900 rounded-lg p-2">
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-44">
        <polyline points={coords.join(" ")} fill="none" stroke="#f97316" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
        <circle cx={coords[0].split(",")[0]} cy={coords[0].split(",")[1]} r="4" fill="#4ade80" />
        <circle cx={coords[coords.length - 1].split(",")[0]} cy={coords[coords.length - 1].split(",")[1]} r="4" fill="#f97316" />
      </svg>
      <div className="text-[10px] text-zinc-500 text-center">Route shape (green = start, orange = current)</div>
    </div>
  );

const FRONT_ZONES = [
  { key: "biceps", top: 6, left: 2, width: 28, height: 20 },
  { key: "biceps", top: 6, left: 70, width: 28, height: 20 },
  { key: "chest", top: 13, left: 32, width: 36, height: 14 },
  { key: "core", top: 25, left: 28, width: 44, height: 20 },
  { key: "legs", top: 45, left: 22, width: 58, height: 18 },

const BACK_ZONES = [
  { key: "triceps", top: 6, left: 2, width: 28, height: 20 },
  { key: "triceps", top: 6, left: 70, width: 28, height: 20 },
  { key: "back", top: 11, left: 30, width: 40, height: 35 },
  { key: "legs", top: 45, left: 22, width: 58, height: 18 },
  { key: "legs", top: 63, left: 17, width: 68, height: 25 },

];

function BodyDiagram({ view, selected, onToggle, size = 240 }) {
  const src = view === "front" ? MUSCLE_FRONT_URI : MUSCLE_BACK_URI;
  const zones = view === "front" ? FRONT_ZONES : BACK_ZONES;
  return (
    <div style={{ position: "relative", width: size, margin: "0 auto" }}>
      <img src={src} alt={`${view} muscle diagram`} style={{ width: "100%", display: "block", borderRadius: 8 }} />
      {zones.map((z, i) => (
        <div
          key={i}
          onClick={() => onToggle(z.key)}
          style={{
            position: "absolute",
            top: `${z.top}%`,
            left: `${z.left}%`,
            width: `${z.width}%`,
            height: `${z.height}%`,
            cursor: "pointer",
          }}
        />
      ))}
    </div>
  );
}

function ExerciseThumb({ name, size = 32 }) {
  const [failed, setFailed] = useState(false);
  const id = EXERCISE_PHOTO_ID[(name || "").toLowerCase()];
  if (!id || failed) {
    return <MoveAnim pattern={movementPattern(name)} size={size} />;
  }
  return (
    <img
      src={`${FREE_EXERCISE_DB_IMAGE}/${id}/0.jpg`}
      alt={name}
      width={size}
      height={size}
      className="object-cover rounded"
      style={{ width: size, height: size }}
      onError={() => setFailed(true)}
    />
  );
}

function MoveAnim({ pattern, size = 36 }) {
  const anim = { animation: `fp-${pattern} 1.1s ease-in-out infinite` };
  return (
    <svg width={size} height={size} viewBox="0 0 40 40" fill="none" stroke="#f97316" strokeWidth="2.5" strokeLinecap="round">
      {pattern === "squat" && (
        <>
          <line x1="10" y1="34" x2="16" y2="24" />
          <line x1="30" y1="34" x2="24" y2="24" />
          <g style={anim}>

function CameraCapture({ onCapture, onClose }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [facing, setFacing] = useState("environment");
  const [error, setError] = useState("");

  useEffect(() => {
    let active = true;
    async function start() {
      setError("");
      try {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach((t) => t.stop());
        }
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
        if (!active) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        streamRef.current = stream;
        if (videoRef.current) videoRef.current.srcObject = stream;
      } catch (err) {
        setError("Camera access isn't available. Check your browser's camera permission for this site, or use a file upload instead.");
      }
    }
    start();
    return () => {
      active = false;
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    };
  }, [facing]);

  function capture() {
    const video = videoRef.current;
    if (!video || !video.videoWidth) return;
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);
    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      onCapture({ url, blob });
    }, "image/jpeg", 0.92);
  }

  return (
    <div className="fixed inset-0 z-50 bg-black flex flex-col">
      <div className="flex items-center justify-between p-4">
        <button onClick={onClose} className="text-white bg-zinc-800/80 rounded-full p-2"><X size={18} /></button>
        <button onClick={() => setFacing((f) => (f === "environment" ? "user" : "environment"))} className="text-white bg-zinc-800/80 rounded-full p-2"><RefreshCw size={18} /></button>
      </div>
      <div className="flex-1 flex items-center justify-center overflow-hidden">
        {error ? (
          <div className="text-zinc-300 text-sm text-center px-8">{error}</div>
        ) : (
          <video ref={videoRef} autoPlay playsInline muted className="max-h-full max-w-full" style={{ transform: facing === "user" ? "scaleX(-1)" : "none" }} />
        )}
      </div>
      <div className="p-8 flex items-center justify-center">
        <button onClick={capture} disabled={!!error} className="w-16 h-16 rounded-full bg-white border-4 border-zinc-400 disabled:opacity-30"></button>
      </div>
    </div>
  );
}

  function startRun() {
    setRunError("");
    if (!navigator.geolocation) {
      setRunError("This browser doesn't support GPS location.");
      return;
    }
    setRunPoints([]);
    setRunElapsed(0);
    setRunAccuracy(null);
    setRunActive(true);
    runStartRef.current = Date.now();
    runTimerRef.current = setInterval(() => {
      setRunElapsed(Math.floor((Date.now() - runStartRef.current) / 1000));
    }, 1000);
    runWatchId.current = navigator.geolocation.watchPosition(
      (pos) => {
        const accuracy = pos.coords.accuracy;
        setRunAccuracy(accuracy);
        // Reject low-confidence readings (phone unsure of its own position)
        if (accuracy != null && accuracy > 30) return;

        const p = { lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now() };

        setRunPoints((prev) => {
          if (prev.length === 0) return [p];
          const last = prev[prev.length - 1];
          const distKm = haversineKm(last, p);
          const distM = distKm * 1000;
          const dtSec = Math.max(0.5, (p.t - last.t) / 1000);
          const impliedSpeedMs = (distM) / dtSec;

          // Ignore GPS noise: tiny jitter while basically stationary
          if (distM < 3) return prev;
          // Ignore GPS jumps: implausible speed (>7 m/s ~25km/h covers running/walking; bikes get a higher ceiling)
          const maxSpeed = runActivity === "bike" ? 15 : 7;
          if (impliedSpeedMs > maxSpeed) return prev;

          return [...prev, p];
        });
      },
      (err) => {
        setRunError("Couldn't get GPS location. Check that location access is allowed for this site.");
      },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
    );
  }

    if (runPoints.length < 2) return;

    const distanceKm = totalDistanceKm(runPoints);
    const distanceInUnit = unit === "kg" ? distanceKm : distanceKm * 0.621371;
    const bodyWeightKg = weightLog.length
      ? convertWeight(weightLog[weightLog.length - 1].weight, weightLog[weightLog.length - 1].unit, "kg")

    const calories = estimateRunCalories(distanceKm, bodyWeightKg, runActivity);

    setPendingRun({

  function discardRun() {
    setPendingRun(null);
    setRunPoints([]);
    setRunElapsed(0);
    setRunShareNote("");
    setRunShareUrl(null);
  }

  function generateRunShareCard(run) {
    const canvas = document.createElement("canvas");
    canvas.width = 1080;
    canvas.height = 1350;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#09090b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#f97316";
    ctx.font = "bold 42px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("FORGED PHYSIQUE", canvas.width / 2, 110);

    ctx.fillStyle = "#f4f4f5";
    ctx.font = "bold 90px sans-serif";
    ctx.fillText(run.activity === "bike" ? "RIDE COMPLETE" : "RUN COMPLETE", canvas.width / 2, 230);

    const pts = run.points;
    if (pts && pts.length > 1) {
      const lats = pts.map((p) => p.lat);
      const lngs = pts.map((p) => p.lng);
      const minLat = Math.min(...lats), maxLat = Math.max(...lats);
      const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
      const spanLat = maxLat - minLat || 0.0005;
      const spanLng = maxLng - minLng || 0.0005;
      const boxX = 90, boxY = 300, boxW = canvas.width - 180, boxH = 560;
      ctx.strokeStyle = "#f97316";
      ctx.lineWidth = 8;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();
      pts.forEach((p, i) => {
        const x = boxX + ((p.lng - minLng) / spanLng) * boxW;
        const y = boxY + boxH - ((p.lat - minLat) / spanLat) * boxH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    const statY = 950;
    const stats = [
      [run.distanceInUnit.toFixed(2), run.distanceUnit.toUpperCase()],
      [formatDuration(run.durationSec), "TIME"],
      [String(run.calories), "KCAL"],
      run.activity === "bike"
        ? [(run.durationSec > 0 ? (run.distanceInUnit / (run.durationSec / 3600)).toFixed(1) : "0.0"), `${run.distanceUnit.toUpperCase()}/H`]
        : [run.steps.toLocaleString(), "STEPS"],
    ];
    const colW = canvas.width / stats.length;
    stats.forEach(([value, label], i) => {
      const cx = colW * i + colW / 2;
      ctx.fillStyle = "#f4f4f5";
      ctx.font = "bold 64px sans-serif";
      ctx.fillText(value, cx, statY);
      ctx.fillStyle = "#a1a1aa";
      ctx.font = "bold 26px sans-serif";
      ctx.fillText(label, cx, statY + 45);
    });

    ctx.fillStyle = "#f97316";
    ctx.font = "bold 34px sans-serif";
    ctx.fillText("#forgedphysique  @forgedphysique.fit", canvas.width / 2, 1280);

    return new Promise((resolve) => canvas.toBlob((blob) => resolve(blob), "image/png"));
  }

  async function shareRun(run) {
    setRunShareNote("");
    const blob = await generateRunShareCard(run);
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    setRunShareUrl(url);
    const file = new File([blob], "forged-physique-run.png", { type: "image/png" });
    const caption = `${run.activity === "bike" ? "Ride" : "Run"} complete: ${run.distanceInUnit.toFixed(2)}${run.distanceUnit} in ${formatDuration(run.durationSec)}. #forgedphysique @forgedphysique.fit`;
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: caption, title: "Forged Physique" });
        return;
      }
      if (navigator.share) {
        await navigator.share({ text: caption, title: "Forged Physique" });

        return;
      }
      setRunShareNote("Sharing isn't supported in this browser. Download the image below and post it manually.");
    } catch (err) {
      setRunShareNote("Share was cancelled or isn't available here. Download the image below if you'd like to post it manually.");
    }

    setRunLog((prev) => prev.filter((r) => r.id !== id));

    if (showCamera === "progress") {
      setProgressPhotos((prev) => [{ preview: url, date: new Date().toLocaleDateString() }, ...prev]);
      setShowCamera(null);
    } else if (showCamera === "promote") {
      setPromotePhoto({ url, blob });
      setShowCamera(null);
    } else if (showCamera === "nutrition") {
      setShowCamera(null);
      scanNutritionLabel(url);
    }
  }

  async function scanNutritionLabel(imageUrl) {
    setScanningLabel(true);
    setScanError("");
    setScanRawText("");
    try {
      const Tesseract = await loadTesseract();
      const { data } = await Tesseract.recognize(imageUrl, "eng");
      const text = data.text || "";
      setScanRawText(text);
      const parsed = parseNutritionLabel(text);
      setManual((prev) => ({
        ...prev,
        cal: parsed.cal || prev.cal,
        p: parsed.p || prev.p,
        c: parsed.c || prev.c,
        f: parsed.f || prev.f,
      }));
      if (!parsed.cal && !parsed.p && !parsed.c && !parsed.f) {
        setScanError("Couldn't find Calories/Protein/Carbs/Fat text on that photo. Make sure the printed Nutrition Facts panel is in focus and well lit, then try again \u2014 or just enter the numbers manually below.");
      }
    } catch (err) {
      setScanError("Label scanning couldn't load. Check your connection and try again, or enter the numbers manually below.");
    }
    setScanningLabel(false);
  }

                        <div className="text-sm font-bold">Weekly goal</div>
                        <div className="flex items-center gap-2">
                          <button onClick={() => setWeeklyGoal((g) => Math.max(1, g - 1))} className="w-6 h-6 rounded bg-zinc-700 hover:bg-zinc-600 font-bold text-sm">-</button>
                          <span className="text-sm font-bold w-16 text-center">{weeklyGoal}/wk</span>
                          <button onClick={() => setWeeklyGoal((g) => Math.min(14, g + 1))} className="w-6 h-6 rounded bg-zinc-700 hover:bg-zinc-600 font-bold text-sm">+</button>
                        </div>
                      </div>
                      <div className="w-full h-2 bg-zinc-900 rounded-full overflow-hidden">
                        <div className="h-full bg-orange-600" style={{ width: `${goalPct}%` }} />
                      </div>
                      <div className="text-[11px] text-zinc-400 mt-1">{thisWeekCount}/{weeklyGoal} completed this week</div>
                    </div>

                    <div className="bg-zinc-800 rounded-xl p-4">
                      <div className="text-sm font-bold mb-3">{monthName}</div>
                      <div className="grid grid-cols-7 gap-1 text-center text-[10px] text-zinc-500 mb-1">
                        {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => <div key={i}>{d}</div>)}
                      </div>
                      <div className="grid grid-cols-7 gap-1">
                        {cells.map((day, i) => {
                          if (!day) return <div key={i} />;
                          const cellDate = new Date(now.getFullYear(), now.getMonth(), day);
                          const worked = dateSet.has(cellDate.toDateString());
                          const scheduled = scheduledSessions.some((s) => !s.completed && new Date(s.date + "T00:00:00").toDateString() === cellDate.toDateString());
                          const isToday = day === todayNum;
                          return (
                            <div
                              key={i}
                              className={`aspect-square rounded-md flex items-center justify-center text-xs font-bold ${
                                worked ? "bg-orange-600 text-white" : scheduled ? "bg-zinc-900 text-orange-400 ring-1 ring-orange-500" : "bg-zinc-900 text-zinc-500"
                              } ${isToday && !worked && !scheduled ? "ring-1 ring-zinc-500" : ""}`}
                            >
                              {day}
                            </div>
                          );
                        })}
                      </div>
                      <div className="flex gap-3 mt-2 text-[10px] text-zinc-500">
                        <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-orange-600 inline-block" /> Completed</div>
                        <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-zinc-900 ring-1 ring-orange-500 inline-block" /> Scheduled</div>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <div className="text-sm font-bold px-1">Upcoming sessions</div>
                      {scheduledSessions.filter((s) => !s.completed).sort((a, b) => a.date.localeCompare(b.date)).map((s) => (
                        <div key={s.id} className="bg-zinc-800 rounded-xl p-4">
                          <div className="flex justify-between items-start mb-2">
                            <div>
                              <div className="font-bold">{s.title}</div>
                              <div className="text-xs text-zinc-400">{new Date(s.date + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}</div>
                            </div>
                            <button onClick={() => deleteScheduledSession(s.id)} className="text-zinc-500 hover:text-red-400"><Trash2 size={16} /></button>
                          </div>
                          <div className="flex gap-2 mb-2">
                            <a href={googleCalendarLink(s)} target="_blank" rel="noopener noreferrer" className="flex-1 text-center bg-zinc-700 hover:bg-zinc-600 rounded-lg p-2 text-xs font-bold">Add to Google Calendar</a>
                            <a href={buildICSBlobUrl(s)} download={`${s.title.replace(/\s+/g, "-")}.ics`} className="flex-1 text-center bg-zinc-700 hover:bg-zinc-600 rounded-lg p-2 text-xs font-bold">Add to Apple/Outlook</a>
                          </div>
                          <button onClick={() => completeSession(s.id)} className="w-full bg-orange-600 hover:bg-orange-500 rounded-lg p-2 text-sm font-bold">Complete session</button>
                        </div>
                      ))}
                      {scheduledSessions.filter((s) => !s.completed).length === 0 && (
                        <div className="text-sm text-zinc-500 text-center py-6">No sessions scheduled yet. Tap "Schedule" on a workout day in the Workout tab.</div>
                      )}
                    </div>
                  </div>
                );
              })()}
            </div>
          )}

          {tab === "promote" && (
            <div className="space-y-4">
              <div className="bg-zinc-800 rounded-xl p-4 space-y-2">
                <div className="text-sm font-bold flex items-center gap-2"><Megaphone size={16} /> Help build the community</div>
                <div className="text-xs text-zinc-400">Capture your progress and share it with the Forged Physique community. Use your device's share options to post directly to Instagram, Facebook, TikTok, WhatsApp, or any other compatible app installed on your phone. Don't forget to tag @forgedphysique.fit so we can celebrate your journey!</div>
              </div>

              {!promotePhoto ? (
                <button onClick={() => setShowCamera("promote")} className="w-full bg-orange-600 hover:bg-orange-500 rounded-lg p-3 font-bold flex items-center justify-center gap-2">
                  <Camera size={18} /> Take a photo to share
                </button>
              ) : (
                <div className="bg-zinc-800 rounded-xl p-4 space-y-3">
                  <img src={promotePhoto.url} className="w-full rounded-lg max-h-72 object-cover" />
                  <textarea value={promoteCaption} onChange={(e) => setPromoteCaption(e.target.value)} rows={2} className="w-full bg-zinc-900 rounded-lg p-2 border border-zinc-700 text-sm" />
                  <div className="flex gap-2">
                    <button onClick={() => { setPromotePhoto(null); setShareNote(""); setShowCamera("promote"); }} className="flex-1 bg-zinc-700 hover:bg-zinc-600 rounded-lg p-2 font-bold text-sm">Retake</button>
                    <button onClick={shareProgress} className="flex-1 bg-orange-600 hover:bg-orange-500 rounded-lg p-2 font-bold text-sm flex items-center justify-center gap-2"><Share2 size={15} /> Share</button>
                  </div>
                  {shareNote && (
                    <div className="text-[11px] text-amber-400 space-y-2">
                      <div>{shareNote}</div>
                      <a href={promotePhoto.url} download="forged-physique-progress.jpg" className="underline text-orange-400">Download photo</a>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>

        <div className="flex border-t border-zinc-800 bg-zinc-900">
          {TABS.map((t) => {
            const Icon = t.icon;
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => setTab(t.id)} className={`flex-1 py-3 flex flex-col items-center gap-1 ${active ? "text-orange-500" : "text-zinc-500"}`}>
                <Icon size={20} />
                <span className="text-[10px] font-bold uppercase tracking-wide">{t.label}</span>
              </button>
            );
          })}
        </div>
      </div>
      {showCamera && <CameraCapture onCapture={handleCameraCapture} onClose={() => setShowCamera(null)} />}
      {menuOpen && (
        <div className="fixed inset-0 z-50 flex">
          <div className="absolute inset-0 bg-black/60" onClick={() => setMenuOpen(false)} />
          <div className="relative w-64 max-w-[80%] h-full bg-zinc-900 border-r border-zinc-800 p-5 space-y-1">
            <div className="flex items-center justify-between mb-4">
              <div className="text-sm font-bold text-orange-500 uppercase tracking-wide">Menu</div>
              <button onClick={() => setMenuOpen(false)} className="text-zinc-400 hover:text-white"><X size={18} /></button>
            </div>
            {[
              { label: "Log Workout", icon: Save, tab: "workout", sub: "log" },
              { label: "Log One Rep Max", icon: Calculator, tab: "workout", sub: "onerm" },
              { label: "Saved Gym Plan", icon: FolderOpen, tab: "workout", sub: "saved" },
              { label: "Streaks", icon: Flame, tab: "progress", sub: "streaks" },
            ].map((item) => {
              const ItemIcon = item.icon;
              return (
                <button
                  key={item.label}
                  onClick={() => goToShortcut(item.tab, item.sub)}
                  className="w-full flex items-center gap-3 text-left px-3 py-3 rounded-lg hover:bg-zinc-800 font-bold text-sm"
                >
                  <ItemIcon size={18} className="text-orange-500" />
                  {item.label}
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

  (function () {
    var src = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(src, { presets: ["react"] }).code;
    var script = document.createElement("script");
    script.text = compiled;
    document.body.appendChild(script);
  })();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
